{% extends 'base.html' %}

{% block title %}{{ status_code }} | FHAPTS{% endblock %}

{% block content %}
<style>
    .error-page {
        min-height: 70vh;
        display: grid;
        place-items: center;
        padding: 4rem 1rem;
        background: #f8fafc;
    }

    .error-card {
        width: min(100%, 620px);
        padding: 3.5rem 2rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e6eaf0;
        border-radius: 12px;
        box-shadow: 0 18px 45px rgba(23, 32, 51, 0.1);
    }

    .error-code {
        margin: 0;
        color: #c62835;
        font-size: clamp(4rem, 12vw, 7rem);
        font-weight: 800;
        line-height: 1;
    }

    .error-card h1 {
        margin: 1rem 0 0.75rem;
        color: #172033;
    }

    .error-card p {
        margin: 0 auto 1.75rem;
        max-width: 460px;
        color: #667085;
        line-height: 1.7;
    }
</style>

<section class="error-page">
    <div class="error-card">
        <p class="error-code">{{ status_code|default:'500' }}</p>
        <h1>{{ error_title|default:'Something went wrong' }}</h1>
        <p>{{ error_message|default:'Please try again later.' }}</p>
        <a class="btn btn-danger" href="{% url back_url|default:'home' %}">
            <i class="bi bi-arrow-left me-2"></i>
            {{ back_label|default:'Return home' }}
        </a>
    </div>
</section>
{% endblock %}
